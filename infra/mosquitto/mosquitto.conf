# eclipse-mosquitto 컨테이너에 이 파일을 꼭 마운트할 것 (기본 설정만 쓰면 WebSocket 이 없음).
#   volumes:
#     - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
#
# `docker exec ... cat /mosquitto/config/mosquitto.conf` 가 아래와 다르면 마운트가 적용 안 된 것.

# TCP MQTT — 백엔드·현장 장비
listener 1883 0.0.0.0
protocol mqtt

# WebSocket — 브라우저(mqtt.js) · Caddy/Nginx 가 wss 로 /mqtt 프록시
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

# (선택) 일부 이미지의 HTTP 대시보드 — 필요할 때만 주석 해제, Mosquitto 버전 확인
# listener 9883
# protocol http_api
# http_dir /usr/share/mosquitto/dashboard
