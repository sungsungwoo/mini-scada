server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MQTT WebSocket 은 upstream 호스트명이 컨테이너 시작 시 해석되어야 해서,
    # 기본 이미지에 넣으면 Linux EC2(host.docker.internal 없음) 등에서 Nginx가 기동 실패할 수 있음.
    # Compose 로 frontend 와 mosquitto 를 같은 네트워크에 둘 때는 nginx.compose.example.conf 를 참고해 마운트.

    # 정적 파일
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }
}
